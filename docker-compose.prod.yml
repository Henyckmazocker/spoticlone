# spoticlone — stack de PRODUCCIÓN (frontend nginx estático + backend Apache + MySQL).
# Arranque:
#   docker compose -p spoticlone_prod -f docker-compose.prod.yml up -d --build
#   docker network connect spoticlone_prod cloudflared
# Ingress del tunnel (dashboard Cloudflare): spoticlone.dcahomelab.com -> http://spoticlone-frontend-prod:80
# Secretos por environment (${...} desde el .env raíz); NO se versionan.

services:
  frontend:
    container_name: spoticlone-frontend-prod
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile.frontend.prod
      args:
        VUE_APP_API_URL: /api
        VUE_APP_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    ports:
      - "8087:80"          # prueba local; el tunnel entra por la red interna
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    networks:
      - spoticlone_prod
    restart: unless-stopped

  backend:
    container_name: spoticlone-backend-prod
    build:
      context: .
      dockerfile: docker/backend/Dockerfile.backend.prod
    expose:
      - "80"
    volumes:
      - backend_storage_prod:/var/www/html/storage
      # Música del host en LECTURA-ESCRITURA (importar descargas de Soulseek a la biblioteca).
      - ${MUSIC_LIBRARY_PATH}:/music
      - ${DOWNLOADS_PATH:-/media/david/Elements2/downloads}:/downloads
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_TIMEZONE=Europe/Madrid
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=spoticlone_db_prod
      - DB_USERNAME=spoticlone_user
      - DB_PASSWORD=${DB_PASSWORD}
      - LOG_PATH=/var/www/html/storage/logs
      - JWT_SECRET=${JWT_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - ALLOWED_EMAILS=${ALLOWED_EMAILS:-}
      - MUSIC_ROOT=/music
      - COVERS_PATH=/var/www/html/storage/covers
      - STREAM_URL_TTL=${STREAM_URL_TTL:-3600}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-https://spoticlone.dcahomelab.com}
      - EXTERNAL_URL_MAX_TTL=${EXTERNAL_URL_MAX_TTL:-86400}
      - LASTFM_API_KEY=${LASTFM_API_KEY:-}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID:-}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET:-}
      - SLSKD_URL=${SLSKD_URL:-http://slskd:5030}
      - SLSKD_API_KEY=${SLSKD_API_KEY:-}
      - DOWNLOADS_ROOT=/downloads/slskd
    command: >
      bash -c "mkdir -p storage/logs storage/cache storage/sessions storage/covers &&
               chown -R www-data:www-data storage/ &&
               chmod -R 775 storage/ &&
               apache2-foreground"
    depends_on:
      - mysql
    networks:
      - spoticlone_prod
      - mediaserver
    restart: unless-stopped

  mysql:
    container_name: spoticlone-mysql-prod
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: spoticlone_db_prod
      MYSQL_USER: spoticlone_user
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data_prod:/var/lib/mysql
      - ./docker/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - spoticlone_prod
    restart: always

networks:
  spoticlone_prod:
    name: spoticlone_prod
  # Red del stack mediaserver (slskd) — para resolver http://slskd:5030 desde el backend.
  mediaserver:
    external: true

volumes:
  mysql_data_prod:
  backend_storage_prod:
