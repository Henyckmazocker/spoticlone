# Contexto http (conf.d/*.conf se incluye dentro de http): formato de log sin query string,
# para que los tokens firmados de /stream.php y /cover.php no queden en el access log.
log_format notoken '$remote_addr - [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

server_tokens off;

# Límites por IP de cliente (la real, ver set_real_ip_from). /api: 10 r/s con ráfaga de 30 frena
# bucles sin que la navegación normal lo note. /stream.php: conexiones simultáneas, no tasa, porque
# el seek y la precarga de la cola abren varias peticiones Range a la vez.
limit_req_zone  $binary_remote_addr zone=api:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=stream_conn:10m;

server {
    listen 80;
    server_name spoticlone.dcahomelab.com;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 15m;

    # Cloudflare real IP configuration
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    # El túnel no llega desde los rangos públicos de arriba: cloudflared entra por la red Docker
    # spoticlone_prod (subred asignada por Docker, hoy 172.30.0.0/16). Sin esto $remote_addr es la IP
    # de cloudflared y limit_req/limit_conn meterían a todos los usuarios en un solo cubo. Si la red
    # se recrea con otra subred, actualiza esta línea (docker network inspect spoticlone_prod).
    set_real_ip_from 172.30.0.0/16;
    real_ip_header CF-Connecting-IP;

    # Gzip compression (texto/JSON; el audio NO se comprime — ver location /stream.php).
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # Proxy del endpoint único del backend.
    # spoticlone postea a /api (exacto); se reescribe a /index.php (acción en el body).
    location /api {
        rewrite ^/api/?$ /index.php break;
        limit_req zone=api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:80;
        proxy_hide_header X-Powered-By;
        # Apache ya manda estas dos (.htaccess) y el include del server las añade otra vez.
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        # scan_library es síncrono; margen para bibliotecas grandes.
        proxy_read_timeout 300s;

        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    # Streaming de audio (binario, fuera del router). Sin buffering ni gzip, y se pasa el
    # header Range para que el backend responda 206 Partial Content y permita el seek.
    location = /stream.php {
        proxy_pass http://backend:80;
        limit_conn stream_conn 8;
        limit_conn_status 429;
        proxy_http_version 1.1;
        proxy_hide_header X-Powered-By;
        # Apache ya manda estas dos (.htaccess) y el include del server las añade otra vez.
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        access_log /var/log/nginx/access.log notoken;   # sin query string (lleva el token)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;   # mod_remoteip en Apache lo necesita en todas las locations
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_request_buffering off;
        gzip off;
        proxy_connect_timeout 60s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Carátulas de álbum (binario, fuera del router).
    location = /cover.php {
        proxy_pass http://backend:80;
        proxy_hide_header X-Powered-By;
        # Apache ya manda estas dos (.htaccess) y el include del server las añade otra vez.
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        access_log /var/log/nginx/access.log notoken;   # sin query string (lleva el token)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;   # mod_remoteip en Apache lo necesita en todas las locations
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        # Sin fichero temporal: una carátula grande que no cabe en los buffers dejaba en el error log
        # el aviso «buffered to a temporary file» con la petición entera (?token=…).
        proxy_buffers 16 64k;
        proxy_max_temp_file_size 0;
    }

    # Assets con hash: cacheables agresivamente (el hash invalida en cada deploy).
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # add_header propio: no hereda el server{}, por eso se repite el include.
        include /etc/nginx/snippets/security_headers.conf;
        access_log off;
    }

    # SPA: el resto cae en index.html. No cachear el HTML para que un deploy nuevo se vea siempre.
    # APK de Android: el mime.types de nginx:alpine no la conoce (saldría como octet-stream y
    # algunos navegadores Android no ofrecen instalarla).
    location /app/ {
        types { application/vnd.android.package-archive apk; }
        default_type application/octet-stream;
        add_header Content-Disposition 'attachment; filename="spoticlone.apk"';
        # add_header propio: no hereda el server{}, por eso se repite el include.
        include /etc/nginx/snippets/security_headers.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
        # add_header propio: no hereda el server{}, por eso se repite el include.
        include /etc/nginx/snippets/security_headers.conf;
    }

    # Cabeceras de seguridad (snippet compartido). OJO: add_header no se hereda; cualquier location
    # con add_header propio debe repetir este include.
    include /etc/nginx/snippets/security_headers.conf;

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    error_page 404 /index.html;
    error_page 500 502 503 504 /index.html;
}
