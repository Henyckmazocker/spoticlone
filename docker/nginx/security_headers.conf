# Cabeceras de seguridad comunes. Se copia a /etc/nginx/snippets/ (NO a conf.d/: nginx.conf
# incluye conf.d/*.conf en http y se cargaría solo, fuera de los include).
# Se incluye en el server{} y en cada location con add_header propio (nginx no hereda add_header).
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
# HSTS sin includeSubDomains ni preload: otros servicios bajo dcahomelab.com podrían no tener HTTPS.
add_header Strict-Transport-Security "max-age=31536000" always;

# CSP enforcing (validada antes en Report-Only: login GSI, reproducción y navegación limpios).
# Bloquea a propósito el script inline que Cloudflare inyecta para JS Detections (window.__CF$cv$params):
# lleva un id por petición, no admite hash, y no compensa abrir 'unsafe-inline' por él.
# Para volver a depurar sin bloquear: comentar la enforcing y descomentar la Report-Only.
#add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://accounts.google.com https://www.gstatic.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self' blob:; connect-src 'self' https://spoticlone.dcahomelab.com https://accounts.google.com https://static.cloudflareinsights.com; frame-src https://accounts.google.com; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com https://www.gstatic.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self' blob:; connect-src 'self' https://spoticlone.dcahomelab.com https://accounts.google.com https://static.cloudflareinsights.com; frame-src https://accounts.google.com; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
